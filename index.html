
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- local que agrupa os comportamentos do sistema -->
   <div class="container">
        <h1><i>To Do List</i></h1>
        <form id="conteudo">
            <input type="text" id="adicionarTarefa" placeholder="Adicionar nova tarefa...">
            <button id="adicionarTarefaButton">Adicionar</button>
        </form>
            <p id="textQuant"><b>Quantidade de Tarefas</b></p>    
            <div id="quantidade">
                <p>Pendentes: <input type="text" id="contPendentes" value="0"></p>
                <p>Concluidas: <input type="text" id="contConcluidas" value="0"> </p>
            </div>
            <div id="campoTarefa">
                <ul id="listaTarefa"></ul>
                <p id="nada">Nenhuma Tarefa Adicionada...</p> 
            </div>
           
        </div>
            
    </div>     

    <script src="script.js"></script>
    
</body>
</html>
